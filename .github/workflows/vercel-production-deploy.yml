# chibatakumi-portfolio-web: main への push で Vercel 本番デプロイを起動する
#
# 目的: Vercel ダッシュボードの「Git 連携だけではデプロイが走らない」状態のバックアップ経路。
# 前提: GitHub リポジトリの Secrets に次を設定する（Settings → Secrets and variables → Actions）:
#   - VERCEL_TOKEN      … https://vercel.com/account/tokens で発行
#   - VERCEL_ORG_ID     … Vercel → Team / Hobby の Settings、または .vercel/project.json の orgId
#   - VERCEL_PROJECT_ID … 対象プロジェクト → Settings → General の Project ID（prj_…）
#
# 注意: Vercel 側の Git 自動デプロイも有効だと、同一 push でデプロイが 2 本走ることがある。
#       ネイティブ連携を直したあと、この workflow の on.push を外すか、ワークフロー全体を削除してよい。
name: vercel-production-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Deploy to Vercel (production)
        run: bunx vercel@50 deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
