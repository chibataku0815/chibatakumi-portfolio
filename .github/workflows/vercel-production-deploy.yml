name: Vercel Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout private Filmtone submodule
        env:
          FILMTONE_SUBMODULE_SSH_KEY: ${{ secrets.FILMTONE_SUBMODULE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$FILMTONE_SUBMODULE_SSH_KEY" > ~/.ssh/filmtone_submodule
          chmod 600 ~/.ssh/filmtone_submodule
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config submodule.vendor/filmtone.url git@github.com:chibataku0815/filmtone.git
          GIT_SSH_COMMAND='ssh -i ~/.ssh/filmtone_submodule -o IdentitiesOnly=yes' git submodule update --init --recursive vendor/filmtone

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install Vercel CLI
        run: npm install --global vercel@51.6.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build prebuilt output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
