# film-lab-core + Next web 本番ビルド + Remotion 短尺レンダー（回帰用）
# 動画レンダー render:grade:img0513 は含めない（public/videos の MOV が無いと失敗するため）。
# Remotion + Three.js は仮想ディスプレイが無いと WebGL context を作れないため、
# ubuntu runner では xvfb + Mesa 系ライブラリを入れてから各 render / still を実行する。
# 方針: docs/remotion-film-lab-ci-grade-video.md を参照。
name: film-lab-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: film-lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Mesa llvmpipe 経由で WebGL を立てやすくする（CI のみ・ローカルには不要）
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies (postinstall builds film-lab-core)
        run: bun install

      - name: film-lab-core tests
        run: bun run --cwd packages/film-lab-core test

      - name: Next.js production build
        run: bun run --cwd apps/web build

      - name: Install headless display + GL deps (Remotion / Chromium WebGL on Linux CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri \
            libgbm1 \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxcb1 \
            libxkbcommon0 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libasound2

      - name: Remotion spike render
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bun run --cwd apps/remotion-film-lab render:spike

      - name: Remotion grade render (LUT + cover AR)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bun run --cwd apps/remotion-film-lab render:grade

      - name: Remotion still (G2-0 LUT あり・代表フレーム)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bun run --cwd apps/remotion-film-lab still:grade

      - name: Remotion still (G2 比較用 LUT なし・同一 grade 数値)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bun run --cwd apps/remotion-film-lab still:grade:nolut

      - name: Confirm still PNG outputs exist
        run: |
          test -f apps/remotion-film-lab/out/stills/grade-default-f45.png
          test -f apps/remotion-film-lab/out/stills/grade-g2-nolut-f45.png
