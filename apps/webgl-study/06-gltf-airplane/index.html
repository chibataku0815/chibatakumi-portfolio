<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 — GLTF Airplane Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px 48px;
      }
      .overlay__title {
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.5;
      }
      .overlay__bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .overlay__hint {
        font-size: 12px;
        font-weight: 300;
        opacity: 0.35;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
      <div class="overlay__title">Low-Poly Airplane — Blender → glTF → Three.js</div>
      <div class="overlay__bottom">
        <div class="overlay__hint">Drag to orbit · Scroll to zoom</div>
        <div class="overlay__hint">Track B — 3D Pipeline</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
