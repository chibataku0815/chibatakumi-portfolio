<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 — Atmos (Scroll-Driven 3D Flight)</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      background: #080a0c;  /* theme: colors.neutral[1] */
      color: #fffdf7;       /* theme: colors.neutral[12] */
      font-family: "Inter", -apple-system, sans-serif;
    }

    canvas#webgl {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .scroll-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 500vh;
      pointer-events: none;
    }

    .section {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .section__inner {
      max-width: 600px;
      padding: 2rem;
      text-align: center;
      pointer-events: auto;
    }

    .section__title {
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 0.5em;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .section__text {
      font-size: clamp(0.875rem, 1.5vw, 1.125rem);
      font-weight: 300;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s;
    }

    .section.is-active .section__title,
    .section.is-active .section__text {
      opacity: 1;
      transform: translateY(0);
    }

    /* Section title colors from theme */
    .section--intro .section__title { color: #fef3c7; }   /* neutral[11] */
    .section--ascent .section__title { color: #ffba18; }   /* amber[10] */
    .section--flight .section__title { color: #8aadc8; }   /* neutral[8] */
    .section--detail .section__title { color: #ffc53d; }   /* amber[9] */
    .section--outro .section__title { color: #fef3c7; }    /* neutral[11] */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #080a0c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      letter-spacing: 0.1em;
      transition: opacity 0.8s ease;
    }

    .loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">Loading…</div>
  <canvas id="webgl"></canvas>

  <div class="scroll-container">
    <section class="section section--intro" data-section="intro">
      <div class="section__inner">
        <h2 class="section__title">Into the Atmosphere</h2>
        <p class="section__text">A surreal flight through clouds and light.</p>
      </div>
    </section>

    <section class="section section--ascent" data-section="ascent">
      <div class="section__inner">
        <h2 class="section__title">Ascending</h2>
        <p class="section__text">Breaking through the cloud layer.</p>
      </div>
    </section>

    <section class="section section--flight" data-section="flight">
      <div class="section__inner">
        <h2 class="section__title">Cruising</h2>
        <p class="section__text">Above the clouds, into the blue.</p>
      </div>
    </section>

    <section class="section section--detail" data-section="detail">
      <div class="section__inner">
        <h2 class="section__title">Closer Look</h2>
        <p class="section__text">Every rivet, every reflection.</p>
      </div>
    </section>

    <section class="section section--outro" data-section="outro">
      <div class="section__inner">
        <h2 class="section__title">Into the Horizon</h2>
        <p class="section__text">Disappearing into the mist.</p>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
