<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
  }
  .container {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* === Header === */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .title {
    font-size: 40px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* === Image comparison row === */
  .comparison {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .card {
    position: relative;
    width: 530px;
    height: 370px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Cinematic filter on After card */
  .card-after img {
    filter: brightness(1.05) contrast(1.4) saturate(0.75);
  }
  .card-after .tint {
    position: absolute;
    inset: 0;
    background: rgba(0, 40, 100, 0.18);
    mix-blend-mode: multiply;
  }
  .card-after .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 80% 80% at 50% 50%,
      transparent 35%,
      rgba(0, 0, 0, 0.4) 100%
    );
  }

  /* Card labels */
  .card-label {
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
  }
  .card-before .card-label {
    color: rgba(255, 255, 255, 0.7);
  }
  .card-after .card-label {
    color: #f59e0b;
  }

  /* Center arrow/divider */
  .arrow {
    font-size: 24px;
    color: rgba(255, 255, 255, 0.3);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">Film Lab</div>
    <div class="subtitle">Browser Color Grading Tool</div>
  </div>
  <div class="comparison">
    <div class="card card-before">
      <img src="file:///Volumes/SamsungPortableSSDX5001/documents/forestone/chibatakumi-portfolio/apps/web/public/images/film-lab/default.jpg" alt="">
      <div class="card-label">Before</div>
    </div>
    <div class="arrow">→</div>
    <div class="card card-after">
      <img src="file:///Volumes/SamsungPortableSSDX5001/documents/forestone/chibatakumi-portfolio/apps/web/public/images/film-lab/default.jpg" alt="">
      <div class="tint"></div>
      <div class="vignette"></div>
      <div class="card-label">After</div>
    </div>
  </div>
</div>
</body>
</html>
